<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}HotelPrep{% endblock %} · Hotel booking data preprocessing</title>
  <meta name="description" content="Cleaning, feature engineering and model-ready preprocessing of 119,390 real hotel bookings.">
  <script>
    // Apply the saved theme before first paint (no light flash in dark mode).
    try {
      const saved = localStorage.getItem("theme");
      if (saved === "light" || saved === "dark") document.documentElement.dataset.theme = saved;
    } catch (_) { /* storage unavailable: follow the OS setting */ }
  </script>
  <link rel="icon" href="{{ url_for('static', filename='img/favicon.svg') }}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;550;600;650;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="{{ url_for('overview') }}" aria-label="HotelPrep home">
        <svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="8" fill="var(--accent)"/>
          <rect x="7" y="9" width="18" height="3" rx="1.5" fill="#fff"/>
          <rect x="7" y="14.5" width="13" height="3" rx="1.5" fill="#fff" opacity=".85"/>
          <rect x="7" y="20" width="8" height="3" rx="1.5" fill="#fff" opacity=".7"/>
        </svg>
        <span class="brand-name">HotelPrep</span>
      </a>
      <nav class="nav" aria-label="Main">
        {% for endpoint, label in nav_pages %}
        <a href="{{ url_for(endpoint) }}" {% if page == endpoint %}aria-current="page"{% endif %}>{{ label }}</a>
        {% endfor %}
      </nav>
      <button class="icon-button" type="button" id="theme-toggle" aria-label="Toggle dark mode">
        <svg class="theme-icon-light" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="theme-icon-dark" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <main>
    <div class="container">
      {% block content %}{% endblock %}
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>Data: Antonio, Almeida &amp; Nunes (2019), <a href="https://doi.org/10.1016/j.dib.2018.11.126">Hotel booking demand datasets</a>, <em>Data in Brief</em>.</p>
      <p>Built by Krishna · VoidMain Technologies AI Internship, Task 2</p>
    </div>
  </footer>

  <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
