# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: hotelprep
    runtime: python
    plan: free
    # Pre-compute page data at build time so the server never loads the full dataset.
    buildCommand: pip install -r requirements.txt && python -m app.build_cache
    startCommand: gunicorn app.app:app
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.0
