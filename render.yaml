# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: hotelprep
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app.app:app
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.0
